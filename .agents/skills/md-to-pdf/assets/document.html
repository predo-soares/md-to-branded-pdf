<!doctype html>
<html lang="{{document_language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{document_title}}</title>
  <style>{{styles}}</style>
</head>
<body class="{{body_class}}">
  <header class="cover">
    <div class="cover-top"><span>{{document_kind}}</span><span class="cover-author">{{author}}<br>{{date}}</span></div>
    <div class="cover-inner"><div class="cover-client">{{client}}</div><h1>{{document_title}}</h1></div>
    <div class="cover-bottom"><span>{{footer_left}}</span><span>{{footer_right}}</span></div>
  </header>
  <main>{{preamble}}{{sections}}</main>
</body>
</html>
